<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="100%" stop-color="#151519"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <!-- Outer glow ring -->
  <circle cx="50" cy="35" r="22" fill="none" stroke="url(#glowGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Eye outer -->
  <circle cx="50" cy="35" r="18" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <!-- Eye inner (pupil) -->
  <circle cx="50" cy="35" r="8" fill="#080810"/>
  <!-- Eye highlight -->
  <ellipse cx="44" cy="29" rx="3" ry="2" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="52" cy="38" rx="1.5" ry="1" fill="rgba(255,255,255,0.3)"/>
  <!-- Third eye / intuition mark -->
  <path d="M50 58 L50 75" stroke="url(#eyeGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="80" r="4" fill="url(#eyeGrad)" filter="url(#glow)"/>
</svg>